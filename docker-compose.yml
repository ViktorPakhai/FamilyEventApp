services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: familyevening
    ports:
      - "80:80"
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_SECRET: your-secret-key-change-in-production
      DB_PATH: /app/data/database.db
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/admin/events"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  app-data:
